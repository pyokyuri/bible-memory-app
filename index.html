    let currentDayIndex = 0; // 0 to 47
    let currentMode = 'full'; // 'full', 'initial', 'blank', 'blind'
    let completedDays = JSON.parse(localStorage.getItem('bible_memorize_completed_v1') || '{}');

    // Chosung helper for Korean
    const CHOSUNG_LIST = [
      'ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 
      'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'
    ];

    function getKoreanInitial(char) {
      const code = char.charCodeAt(0) - 0xAC00;
      if (code > -1 && code < 11172) {
        return CHOSUNG_LIST[Math.floor(code / 588)];
      }
      return char;
    }

    function toInitialString(text) {
      return text.split('').map(char => {
        if (/[가-힣]/.test(char)) {
          return getKoreanInitial(char);
        }
        return char;
      }).join('');
    }

    function computeTodayIndex() {
      const today = new Date();
      // 날짜 차이 계산
      const diffTime = today.setHours(0,0,0,0) - new Date(2026, 8, 28).setHours(0,0,0,0);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      if (diffDays >= 0 && diffDays < TOTAL_DAYS) {
        return diffDays;
      } else if (diffDays < 0) {
        return 0; // 시작 전이면 Day 1
      } else {
        return TOTAL_DAYS - 1; // 끝났으면 마지막 날
      }
    }

    const todayOfficialIndex = computeTodayIndex();
    currentDayIndex = todayOfficialIndex;

    const verseContentEl = document.getElementById('verseContent');
    const verseRefEl = document.getElementById('verseReference');
    const verseThemeBadgeEl = document.getElementById('verseThemeBadge');
    const currentDateDisplayEl = document.getElementById('currentDateDisplay');
    const dateRangeInfoEl = document.getElementById('dateRangeInfo');
    const badgeTodayEl = document.getElementById('badgeToday');
    const toggleCompleteBtn = document.getElementById('toggleCompleteBtn');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const modeHelperEl = document.getElementById('modeHelper');
    const allDaysContainer = document.getElementById('allDaysContainer');

    function updateProgress() {
      const count = Object.values(completedDays).filter(Boolean).length;
      const pct = Math.round((count / TOTAL_DAYS) * 100);
      progressBar.style.width = `${pct}%`;
      progressText.textContent = `${count} / ${TOTAL_DAYS}일 (${pct}%)`;
    }

    function renderScheduleGrid() {
      allDaysContainer.innerHTML = '';
      BIBLE_PLAN.forEach((item, idx) => {
        const isSelected = idx === currentDayIndex;
        const isToday = idx === todayOfficialIndex;
        const isDone = !!completedDays[item.day];

        const btn = document.createElement('button');
        btn.className = `p-2.5 rounded-2xl flex flex-col items-center justify-center text-center transition-all text-xs border relative ${
          isSelected 
            ? 'bg-amber-500 text-white border-amber-600 shadow-md font-bold scale-[1.03]' 
            : isDone 
              ? 'bg-emerald-50 text-emerald-800 border-emerald-200 hover:bg-emerald-100 font-semibold' 
              : 'bg-white text-slate-700 border-slate-200 hover:bg-slate-50'
        }`;

        let statusIcon = '';
        if (isDone) {
          statusIcon = `<span class="absolute top-1 right-1 text-[10px] text-emerald-600"><i class="fa-solid fa-circle-check"></i></span>`;
        }

        btn.innerHTML = `
          ${statusIcon}
          <span class="text-[10px] opacity-80">${item.month}/${item.date}</span>
          <span class="font-bold text-xs mt-0.5">D-${item.day}</span>
          <span class="text-[9px] truncate max-w-full mt-0.5 ${isSelected ? 'text-amber-100' : 'text-slate-400'}">${item.ref.split(' ')[0]} ${item.ref.split(' ')[1] || ''}</span>
        `;

        btn.addEventListener('click', () => {
          currentDayIndex = idx;
          renderDayView();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        allDaysContainer.appendChild(btn);
      });
    }

    function renderVerseText() {
      const data = BIBLE_PLAN[currentDayIndex];
      const rawText = data.text;

      modeHelperEl.classList.add('hidden');

      if (currentMode === 'full') {
        verseContentEl.innerHTML = rawText.replace(/\n/g, '<br><br>');
      } else if (currentMode === 'initial') {
        const initialText = toInitialString(rawText);
        verseContentEl.innerHTML = `<span class="tracking-widest font-mono text-slate-700 font-medium">${initialText.replace(/\n/g, '<br><br>')}</span>`;
      } else if (currentMode === 'blank') {
        modeHelperEl.classList.remove('hidden');
        // 일부 단어들을 마스킹
        const words = rawText.split(/(\s+)/);
        let wordCounter = 0;
        const html = words.map(chunk => {
          if (/^\s+$/.test(chunk)) return chunk.replace(/\n/g, '<br>');
          wordCounter++;
          // 2번째 혹은 3번째 단어마다 빈칸 처리
          if (wordCounter % 2 === 0 && chunk.length > 1) {
            return `<span class="blank-word inline-block bg-amber-100 text-amber-100 hover:text-slate-900 border-b-2 border-amber-400 px-1 rounded cursor-pointer transition selection:bg-transparent" onclick="this.classList.toggle('text-slate-900'); this.classList.toggle('text-amber-100');">${chunk}</span>`;
          }
          return chunk;
        }).join('');
        verseContentEl.innerHTML = html;
      } else if (currentMode === 'blind') {
        verseContentEl.innerHTML = `
          <div class="py-10 text-center flex flex-col items-center justify-center cursor-pointer group" onclick="setMode('full')">
            <div class="w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mb-3 group-hover:scale-110 transition">
              <i class="fa-solid fa-eye-slash"></i>
            </div>
            <p class="font-bold text-slate-700 text-base mb-1">말씀이 숨겨져 있습니다</p>
            <p class="text-xs text-slate-400">마음속으로 암송해본 후 여기를 터치해 정답을 확인하세요!</p>
          </div>
        `;
      }
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(tab => {
        if (tab.dataset.mode === mode) {
          tab.className = 'mode-tab px-3 py-1.5 rounded-xl bg-slate-900 text-white transition active:scale-95 font-bold shadow-sm';
        } else {
          tab.className = 'mode-tab px-3 py-1.5 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition active:scale-95';
        }
      });
      renderVerseText();
    }

    function renderDayView() {
      const data = BIBLE_PLAN[currentDayIndex];
      const isToday = currentDayIndex === todayOfficialIndex;
      const isDone = !!completedDays[data.day];

      // Badges & References
      verseThemeBadgeEl.textContent = data.theme;
      verseRefEl.textContent = data.ref;
      currentDateDisplayEl.textContent = `${data.dateStr} · Day ${data.day}`;
      dateRangeInfoEl.textContent = `${data.dateStr} 암송 구절`;

      if (isToday) {
        badgeTodayEl.classList.remove('hidden');
        badgeTodayEl.innerHTML = `<i class="fa-solid fa-sparkles text-amber-500"></i> 오늘의 암송구절!`;
        badgeTodayEl.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 mb-0.5 pulse-glow";
      } else {
        badgeTodayEl.classList.remove('hidden');
        badgeTodayEl.className = "inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 text-slate-600 mb-0.5";
        badgeTodayEl.innerHTML = `Day ${data.day} of ${TOTAL_DAYS}`;
      }

      // Checkbox state
      if (isDone) {
        toggleCompleteBtn.innerHTML = `
          <i class="fa-solid fa-circle-check text-lg text-emerald-500"></i>
          <span class="text-emerald-700 font-bold">암송 완료됨</span>
        `;
        toggleCompleteBtn.className = "w-full sm:w-auto px-5 py-2.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95 bg-emerald-50 border border-emerald-300 text-emerald-800";
      } else {
        toggleCompleteBtn.innerHTML = `
          <i class="fa-regular fa-circle-check text-lg text-slate-400"></i>
          <span>오늘 암송 완료하기</span>
        `;
        toggleCompleteBtn.className = "w-full sm:w-auto px-5 py-2.5 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-sm active:scale-95 bg-white border border-slate-300 text-slate-700 hover:border-emerald-500 hover:text-emerald-700";
      }

      renderVerseText();
      renderScheduleGrid();
      updateProgress();
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-3');
      toast.classList.add('opacity-100', 'translate-y-0');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-3');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2000);
    }

    function copyVerse() {
      const data = BIBLE_PLAN[currentDayIndex];
      const copyText = `[말씀 암송 48일 - Day ${data.day}]\n${data.ref}\n\n${data.text}`;
      
      const textArea = document.createElement("textarea");
      textArea.value = copyText;
      document.body.appendChild(textArea);
      textArea.select();
      try {
        document.execCommand('copy');
        showToast("구절이 클립보드에 복사되었습니다!");
      } catch (err) {
        showToast("복사에 실패했습니다.");
      }
      document.body.removeChild(textArea);
    }

    // TTS voice speech synthesis
    function speakVerse() {
      const data = BIBLE_PLAN[currentDayIndex];
      if (!('speechSynthesis' in window)) {
        showToast("음성 읽기를 지원하지 않는 브라우저입니다.");
        return;
      }
      window.speechSynthesis.cancel();
      const speakText = `${data.ref}. ${data.text}`;
      const utterance = new SpeechSynthesisUtterance(speakText);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.88; // 또박또박 낭독 속도
      window.speechSynthesis.speak(utterance);
      showToast("말씀을 낭독합니다.");
    }

    document.getElementById('prevDayBtn').addEventListener('click', () => {
      if (currentDayIndex > 0) {
        currentDayIndex--;
        renderDayView();
      } else {
        showToast("첫 번째 구절입니다.");
      }
    });

    document.getElementById('nextDayBtn').addEventListener('click', () => {
      if (currentDayIndex < TOTAL_DAYS - 1) {
        currentDayIndex++;
        renderDayView();
      } else {
        showToast("마지막 암송 구절입니다!");
      }
    });

    document.getElementById('todayJumpBtn').addEventListener('click', () => {
      currentDayIndex = todayOfficialIndex;
      renderDayView();
      showToast("오늘의 암송구절로 이동했습니다!");
    });

    document.getElementById('toggleListBtn').addEventListener('click', () => {
      allDaysContainer.scrollIntoView({ behavior: 'smooth' });
    });

    document.querySelectorAll('.mode-tab').forEach(tab => {
      tab.addEventListener('click', (e) => {
        setMode(e.currentTarget.dataset.mode);
      });
    });

    document.getElementById('copyBtn').addEventListener('click', copyVerse);
    document.getElementById('speakBtn').addEventListener('click', speakVerse);

    toggleCompleteBtn.addEventListener('click', () => {
      const currentDay = BIBLE_PLAN[currentDayIndex].day;
      if (completedDays[currentDay]) {
        delete completedDays[currentDay];
        showToast(`Day ${currentDay} 암송 완료를 취소했습니다.`);
      } else {
        completedDays[currentDay] = true;
        showToast(`Day ${currentDay} 암송 완료! 은혜로운 하루 되세요 🙏`);
      }
      localStorage.setItem('bible_memorize_completed_v1', JSON.stringify(completedDays));
      renderDayView();
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderDayView();
      // 오늘 날짜 안내
      setTimeout(() => {
        showToast("오늘의 암송구절이 준비되었습니다!");
      }, 500);
    });
  </script>
</body>
</html>
